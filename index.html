<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desafía · prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Desafía · la app del proyecto Aprendiendo con inteligencia
   De la marca solo se usan los recursos: colores, estrella y tipografías.
   El diseño es propio: un camino de juego con botones que se hunden,
   nodos grandes, banners de tema y una estrella-mascota con cara.
   Movimiento (skills Emil Design + Animate):
   - solo transform y opacity; curvas propias; nada de ease-in
   - toque: 100–160 ms (el botón se hunde); hojas y festejos: 250–450 ms
   - el festejo vive solo en el resultado correcto; el error sacude una vez
   - las entradas se disparan con #view[data-fx], no en cada repintado
   - "Quitar animaciones" y prefers-reduced-motion lo apagan todo
   ========================================================= */
:root{
  --violeta:#7620ff; --violeta-d:#4b12b0; --azul:#3939ff; --azul-d:#2424b3;
  --lima:#ddff50; --lima-d:#b6dc1e; --fucsia:#ce5aff; --lapacho:#ce5aff; --lapacho-d:#a23bd1;
  --ink:#1b1340; --paper:#ffffff; --panel:#f6f1ff; --muted:#5a5478; --hair:#e4d9ff;
  --accent:#3939ff; --accent-soft:#e8eaff; --good-bg:#f3ffbf; --good-ink:#1b1340;
  --bad-bg:#fbe3ff; --bad-ink:#8a1fb0; --stage:#7620ff; --bg:#ffffff;
  --f:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-io:cubic-bezier(.77,0,.175,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  --r:20px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;font-weight:400;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--azul);outline-offset:3px}
::selection{background:var(--lima);color:var(--azul)}
h1,h2,h3,p{margin:0}
h1,h2,h3,.btn,.tab,.stat,.chip,.mono,.who,.rtag,.seg button,.subjbtn,.subjhandle,.node .lbl,.unit-h .pill,.fab,.pts,.flag,.code,.wm,.eq button,.field label,.t th,.opt .k,.tag{font-family:var(--f)}
h1{font-size:1.875rem;font-weight:800;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:1.5rem;font-weight:800;line-height:1.1;letter-spacing:-.015em;text-wrap:balance}
h3{font-size:1.125rem;font-weight:800;line-height:1.2}
p{text-wrap:pretty}
b,strong{font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.8125rem;line-height:1.45;color:var(--muted)}
.center{text-align:center}
.mono{font-weight:800;letter-spacing:.12em}
.hl{background:var(--lima);color:var(--azul);font-weight:700;padding:.04em .3em .08em;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* ---------- escenario y teléfono ---------- */
#stage{position:relative;height:100%;display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden}
#stage::before,#stage::after{content:'';position:absolute;pointer-events:none;background:no-repeat center/contain}
#stage::before{width:min(46vw,560px);aspect-ratio:595/842;right:-6%;top:-10%;background-image:var(--star-lapacho);animation:bobA 2.4s linear infinite}
#stage::after{width:min(18vw,220px);aspect-ratio:595/842;left:6%;bottom:4%;background-image:var(--star-lima);animation:bobB 1.6s linear -.3056s infinite}
#phone{position:relative;z-index:1;width:100%;max-width:410px;height:100%;max-height:860px;background:var(--bg);border:3px solid var(--ink);border-radius:38px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 0 rgba(27,19,64,.35)}
@media (max-width:520px){#stage{padding:0}#stage::before,#stage::after{display:none}#phone{max-width:none;max-height:none;border:0;border-radius:0;box-shadow:none}}
#view{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:18px 18px 30px;background:var(--bg)}
.stack>*+*{margin-top:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}

/* ---------- marca y mascota ---------- */
.wm{display:inline-flex;align-items:baseline;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--violeta);font-size:1.625rem}
.wm b{font-weight:800;color:var(--azul);background:var(--lima);padding:0 .14em;margin-left:.03em;border-radius:8px}
.wm-xl{font-size:clamp(3rem,15vw,3.75rem);color:#fff}
.mascot{display:block;overflow:visible}
.mascot .m-b{fill:var(--lima);stroke:var(--ink);stroke-width:16;stroke-linejoin:round}
.mascot .m-e{fill:var(--ink)}
.mascot .m-m{fill:none;stroke:var(--ink);stroke-width:16;stroke-linecap:round}
.mascot .m-c{fill:var(--lapacho);opacity:.85}
.mascot.m-wow .m-b{fill:var(--lapacho)}
.brandbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 6px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;background:var(--violeta);color:#fff}
.topbar strong{font-family:var(--f);font-weight:800}
.topbar .small,.topbar .muted{color:#e9e1ff}

/* ---------- ingreso ---------- */
.lg-hero{position:relative;overflow:hidden;background:var(--violeta);color:#fff;margin:-18px -18px 6px;padding:40px 22px 36px;border-radius:0 0 36px 36px}
.lg-hero .lg-star{position:absolute;right:-24%;top:-20%;width:78%;fill:var(--lapacho);opacity:.9;animation:bobA 2.4s linear infinite}
.lg-hero .lg-star2{position:absolute;right:38%;top:6%;width:13%;fill:var(--lima);animation:bobB 1.6s linear -.3056s infinite}
.lg-hero>*:not(svg){position:relative;z-index:1}
.lg-hero .mascot{position:absolute;right:20px;bottom:-4px;width:84px;z-index:2;animation:bobA 2.4s linear infinite}
.lg-hero p{font-size:1.125rem;line-height:1.4;margin-top:16px;max-width:15ch;color:#f1eaff}

/* ---------- botones: relieve que se hunde ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--hair);background:var(--paper);color:var(--violeta);border-radius:18px;padding:12px 22px;font-weight:800;font-size:1rem;min-height:52px;text-align:center;box-shadow:0 4px 0 var(--hair);transition:transform 120ms var(--ease-out),box-shadow 120ms var(--ease-out),background-color 160ms ease}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--hair)}
.btn.primary{background:var(--violeta);color:#fff;border-color:var(--violeta);box-shadow:0 5px 0 var(--violeta-d)}
.btn.primary:active{box-shadow:0 2px 0 var(--violeta-d)}
.btn.dashed{background:var(--lima);color:var(--azul);border-color:var(--lima-d);box-shadow:0 5px 0 var(--lima-d)}
.btn.dashed:active{box-shadow:0 2px 0 var(--lima-d)}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:42px;padding:6px 16px;font-size:.875rem;border-radius:14px;box-shadow:0 3px 0 var(--hair)}
.btn.sm.primary,.btn.sm.dashed{box-shadow:0 3px 0 var(--violeta-d)}
.btn.sm.dashed{box-shadow:0 3px 0 var(--lima-d)}
.btn[disabled]{background:var(--panel);color:#a79fc9;border-color:var(--hair);box-shadow:none;cursor:not-allowed;transform:none}
.overlay .btn{margin-top:4px}
.iconbtn{width:44px;height:44px;border:2px solid rgba(255,255,255,.55);border-radius:14px;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;transition:transform 120ms var(--ease-out),background-color 160ms ease}
.sheet .iconbtn{border-color:var(--hair);background:var(--panel);color:var(--violeta)}
.iconbtn:active{transform:scale(.92)}
@media (hover:hover) and (pointer:fine){
  .btn.primary:not([disabled]):hover{background:var(--azul);border-color:var(--azul);box-shadow:0 5px 0 var(--azul-d)}
  .btn:not(.primary):not(.dashed):not([disabled]):hover{background:var(--panel)}
  .btn.dashed:not([disabled]):hover{background:#efff98}
}

/* ---------- contenedores ---------- */
.card{border:2px solid var(--hair);border-radius:var(--r);padding:16px;background:var(--paper);box-shadow:0 4px 0 var(--hair)}
.card.soft{background:var(--panel);box-shadow:none}
button.card{transition:transform 120ms var(--ease-out),box-shadow 120ms var(--ease-out)}
button.card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--hair)}
hr.sep{border:0;border-top:2px dashed var(--hair);margin:18px 0}

/* ---------- formularios ---------- */
input:not([type]),input[type=text],select,input[type=password],input[type=email],textarea{width:100%;border:2px solid var(--hair);border-radius:16px;padding:12px 16px;background:var(--panel);color:var(--ink);min-height:52px;font-size:1rem;transition:border-color 160ms ease,background-color 160ms ease}
input:focus,select:focus,textarea:focus{border-color:var(--violeta);background:#fff;outline:none}
textarea{min-height:130px;resize:vertical;line-height:1.5}
.field label{display:block;font-size:.8125rem;font-weight:800;color:var(--muted);margin-bottom:6px}
.seg{display:flex;border:2px solid var(--hair);border-radius:18px;overflow:hidden;background:var(--panel);padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:10px;font-weight:800;color:var(--muted);min-height:46px;border-radius:14px;transition:background-color 160ms ease,color 160ms ease,transform 120ms var(--ease-out)}
.seg button:active{transform:scale(.97)}
.seg button.on{background:var(--violeta);color:#fff;box-shadow:0 3px 0 var(--violeta-d)}

/* ---------- barra inferior ---------- */
.tabs{display:flex;border-top:2px solid var(--hair);background:var(--paper);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
.tab{position:relative;flex:1;border:0;background:transparent;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;font-weight:700;color:var(--muted);min-height:58px;border-radius:16px;transition:transform 120ms var(--ease-out)}
.tab:active{transform:scale(.94)}
.tab svg{box-sizing:content-box;padding:4px 16px;border-radius:14px;transition:background-color 200ms ease}
.tab.on{color:var(--violeta);font-weight:800}
.tab.on svg{background:var(--lima);color:var(--azul);box-shadow:0 3px 0 var(--lima-d)}

/* ---------- chips, estados, fichas ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px}
.chip{flex:none;border:2px solid var(--hair);border-radius:999px;padding:6px 16px;background:var(--paper);font-weight:800;font-size:.875rem;color:var(--ink);min-height:42px;box-shadow:0 3px 0 var(--hair);transition:transform 120ms var(--ease-out),box-shadow 120ms var(--ease-out)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--hair)}
.chip.on{background:var(--violeta);color:#fff;border-color:var(--violeta);box-shadow:0 3px 0 var(--violeta-d)}
.stat{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--hair);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.875rem;background:var(--paper);font-variant-numeric:tabular-nums}
.ficha{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;background:var(--lima);color:var(--azul);border:2px solid var(--azul);border-radius:50%;font-family:var(--f);font-size:9px;font-weight:800;line-height:1;box-shadow:0 2px 0 var(--azul)}
.dots{display:inline-flex;gap:3px;margin-left:2px}
.dots i{width:8px;height:8px;border-radius:50%;border:2px solid currentColor}
.dots i.on{background:currentColor}
.flag{display:inline-block;background:var(--lapacho);color:#fff;border-radius:999px;padding:1px 10px;font-size:.75rem;font-weight:800;white-space:nowrap}
.lbl-y{background:var(--lima);color:var(--azul);padding:2px 8px;border-radius:6px;font-weight:800}

/* ---------- cabecera de materias ---------- */
.hbar{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--violeta)}
.subjhandle{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;border-radius:16px;padding:6px 14px;font-weight:800;min-height:48px;text-align:left;transition:transform 120ms var(--ease-out)}
.subjhandle:active{transform:scale(.97)}
.subjhandle .chev{margin-left:auto;transition:transform 260ms var(--ease-out)}
.subjhandle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.hbar .stat,.gbar .stat{background:var(--lima);color:var(--azul);border-color:var(--lima-d)}
.drawer{max-height:0;overflow:hidden;transition:max-height 280ms var(--ease-out);background:var(--violeta)}
.drawer.open{max-height:330px}
.subjgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:4px 14px 16px}
.subjbtn{display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:18px;padding:10px 2px;font-size:.75rem;font-weight:800;min-width:0;min-height:80px;transition:transform 120ms var(--ease-out)}
.subjbtn:active{transform:scale(.94)}
.subjbtn.on{background:var(--lima);color:var(--azul);border-color:var(--lima-d);box-shadow:0 4px 0 var(--lima-d)}
.subjbtn small{font-family:var(--f-body);font-weight:400;font-size:.75rem;opacity:.9}

/* ---------- camino ---------- */
.path{position:relative;padding:6px 0 2px}
/* camino lima: una línea ancha y plana que une los nodos en zigzag (la dibuja drawPaths()) */
.path-line{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:0}
.path-line path{fill:none;stroke:var(--lima);stroke-width:40;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0}
.path-line .pl-todo{opacity:.55}
.path .node,.path .unit-h{z-index:1}
.path .node{transition:none}
.unit-h{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 28px;padding:14px 16px;background:var(--violeta);color:#fff;border-radius:22px;box-shadow:0 5px 0 var(--violeta-d);overflow:hidden}
.unit-h::after{content:'';position:absolute;right:-22px;top:-30px;width:90px;height:128px;background:var(--star-lapacho) no-repeat center/contain;opacity:.9;pointer-events:none}
.unit-h .pill{position:relative;z-index:1;background:none;color:#fff;padding:0;font-weight:800;font-size:1.0625rem;line-height:1.15;max-width:78%;text-align:left}
.unit-h .mini{position:relative;z-index:1}
.mini{width:38px;height:38px;border:2px solid rgba(255,255,255,.6);border-radius:12px;background:rgba(255,255,255,.18);display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none;transition:transform 120ms var(--ease-out)}
.mini:active{transform:scale(.9)}
.node{position:relative;display:flex;flex-direction:column;align-items:center;margin:0 0 28px}
.node .circ{position:relative;width:80px;height:80px;border-radius:50%;border:0;background:var(--paper);color:var(--violeta);display:flex;align-items:center;justify-content:center;box-shadow:0 7px 0 var(--hair),inset 0 0 0 4px var(--hair);transition:transform 120ms var(--ease-out),box-shadow 120ms var(--ease-out)}
.node .circ:active{transform:translateY(5px);box-shadow:0 2px 0 var(--hair),inset 0 0 0 4px var(--hair)}
.node.bonus .circ{border-radius:28px;background:var(--lapacho);color:#fff;box-shadow:0 7px 0 var(--lapacho-d),inset 0 0 0 4px rgba(255,255,255,.35)}
.node.bonus .circ:active{box-shadow:0 2px 0 var(--lapacho-d),inset 0 0 0 4px rgba(255,255,255,.35)}
.node.done .circ{background:var(--violeta);color:#fff;box-shadow:0 7px 0 var(--violeta-d),inset 0 0 0 4px rgba(255,255,255,.3)}
.node.done .circ:active{box-shadow:0 2px 0 var(--violeta-d),inset 0 0 0 4px rgba(255,255,255,.3)}
.node.bonus.done .circ{background:var(--lapacho);box-shadow:0 7px 0 var(--lapacho-d),inset 0 0 0 4px rgba(255,255,255,.55)}
.node.cur .circ{width:92px;height:92px;background:var(--lima);color:var(--azul);box-shadow:0 8px 0 var(--lima-d),inset 0 0 0 5px rgba(57,57,255,.25)}
.node.cur .circ:active{box-shadow:0 3px 0 var(--lima-d),inset 0 0 0 5px rgba(57,57,255,.25)}
.node.cur .circ::after{content:'';position:absolute;inset:-10px;border:4px solid var(--lima);border-radius:inherit;animation:pulse 1.8s var(--ease-out) infinite;pointer-events:none}
.node.cur::before{content:'¡Empezá!';position:absolute;top:-30px;font-family:var(--f);font-weight:800;font-size:.8125rem;color:#fff;background:var(--azul);padding:3px 12px;border-radius:12px;animation:bobA 2.4s linear infinite}
.node.cur::after{content:'';position:absolute;top:-8px;width:12px;height:12px;background:var(--azul);transform:rotate(45deg);border-radius:2px;z-index:-1}
.node.lock .circ{background:var(--panel);color:#a79fc9;box-shadow:0 6px 0 var(--hair),inset 0 0 0 4px var(--hair)}
.node .lbl{margin-top:12px;font-size:.9375rem;font-weight:800;background:var(--bg);padding:0 8px;text-align:center;max-width:210px;line-height:1.2}
.node .tag{font-size:.75rem;color:var(--muted);background:var(--bg);padding:0 8px;font-weight:700}
.fab{position:absolute;right:14px;bottom:84px;z-index:10;display:flex;align-items:center;gap:8px;border:2px solid var(--lima-d);background:var(--lima);color:var(--azul);border-radius:18px;padding:11px 18px;font-weight:800;min-height:52px;box-shadow:0 5px 0 var(--lima-d);transition:transform 120ms var(--ease-out),box-shadow 120ms var(--ease-out)}
.fab:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lima-d)}

/* ---------- ronda ---------- */
.gbar{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--violeta)}
.prog{flex:1;display:flex;gap:5px}
.prog i{flex:1;height:14px;border-radius:7px;background:rgba(255,255,255,.28);position:relative;overflow:hidden}
.prog i.on{background:var(--lima)}
.prog i.on::after{content:'';position:absolute;left:5px;right:5px;top:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.55)}
.rtag{display:inline-block;font-size:.75rem;color:var(--azul);background:var(--accent-soft);font-weight:800;letter-spacing:.01em;margin-bottom:12px;padding:3px 12px;border-radius:999px}
.opt{display:flex;width:100%;text-align:left;gap:12px;align-items:center;border:2px solid var(--hair);background:var(--paper);border-radius:18px;padding:13px 14px;margin-top:12px;font-weight:700;min-height:58px;color:var(--ink);box-shadow:0 4px 0 var(--hair);transition:transform 120ms var(--ease-out),box-shadow 120ms var(--ease-out),background-color 160ms ease,border-color 160ms ease}
button.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--hair)}
.opt .k{flex:none;width:32px;height:32px;border:2px solid var(--hair);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.875rem;font-weight:800;color:var(--violeta);background:var(--panel)}
.opt.sel{background:var(--accent-soft);border-color:var(--azul);box-shadow:0 4px 0 var(--azul-d)}
.opt.sel .k{background:var(--azul);color:#fff;border-color:var(--azul)}
.opt.ok{background:var(--good-bg);border-color:var(--lima-d);box-shadow:0 4px 0 var(--lima-d)}
.opt.ok .k{background:var(--lima);color:var(--azul);border-color:var(--lima-d)}
.opt.no{background:var(--bad-bg);border-color:var(--lapacho);border-style:dashed;box-shadow:none}
.opt.dim{opacity:.55;box-shadow:none}
@media (hover:hover) and (pointer:fine){button.opt:hover{background:var(--panel)}button.pickcard:hover{background:var(--panel)}}
.ai{position:relative;border:2px solid var(--lima-d);border-radius:20px 20px 20px 6px;padding:14px 16px;background:var(--lima);color:var(--ink);margin-top:18px;box-shadow:0 4px 0 var(--lima-d)}
.ai p{color:var(--ink)}
.ai .small{color:var(--ink)}
.who{display:inline-block;font-size:.75rem;font-weight:800;border-radius:999px;padding:1px 10px;margin-bottom:8px;background:var(--azul);color:#fff}
.hintcard{border:2px solid var(--lapacho);border-radius:20px;padding:14px 16px;background:var(--panel);margin-top:16px}
.hintcard .who{background:var(--lapacho)}
.hintcard p{font-size:.9375rem;line-height:1.55;color:var(--ink)}
.verdict{position:relative;border:2px solid var(--hair);border-radius:22px;padding:16px;margin-top:16px;background:var(--panel);color:var(--ink)}

/* ---------- recompensas y error ---------- */

/* ---------- perfil, tienda, tablas ---------- */

/* ---------- hojas, diálogos y avisos ---------- */
.overlay{position:absolute;inset:0;background:rgba(27,19,64,.55);display:flex;align-items:flex-end;z-index:20}

/* =========================================================
   ANIMACIONES
   ========================================================= */
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes bobA{0%{transform:translateY(0)}12.5%{transform:translateY(-5.66px)}25%{transform:translateY(-8px)}37.5%{transform:translateY(-5.66px)}50%{transform:translateY(0)}62.5%{transform:translateY(5.66px)}75%{transform:translateY(8px)}87.5%{transform:translateY(5.66px)}100%{transform:translateY(0)}}
@keyframes bobB{0%{transform:translateY(0)}12.5%{transform:translateY(-4.24px)}25%{transform:translateY(-6px)}37.5%{transform:translateY(-4.24px)}50%{transform:translateY(0)}62.5%{transform:translateY(4.24px)}75%{transform:translateY(6px)}87.5%{transform:translateY(4.24px)}100%{transform:translateY(0)}}
@keyframes pulse{from{transform:scale(.92);opacity:.9}to{transform:scale(1.2);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes nodeIn{from{opacity:0;transform:translateY(16px) scale(.9)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes popBig{0%{opacity:0;transform:scale(.6)}65%{opacity:1;transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes selPop{0%{transform:scale(.97)}60%{transform:scale(1.015)}100%{transform:scale(1)}}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes wiggle{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(-14px) rotate(6deg)}}
@keyframes fly{0%{opacity:0;transform:translate(0,0) scale(.5) rotate(0deg)}25%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--dr))}}

/* entradas de pantalla: solo al navegar (data-fx="nav"), no en cada repintado */
#view[data-fx~="nav"] .screen>*{animation:rise 360ms var(--ease-out) backwards}
#view[data-fx~="nav"] .screen>*:nth-child(2){animation-delay:40ms}
#view[data-fx~="nav"] .screen>*:nth-child(3){animation-delay:80ms}
#view[data-fx~="nav"] .screen>*:nth-child(4){animation-delay:120ms}
#view[data-fx~="nav"] .screen>*:nth-child(n+5){animation-delay:160ms}
#view[data-fx~="nav"] .path{animation:none}
#view[data-fx~="nav"] .path-line .pl-all{animation:draw 1700ms var(--ease-io) 120ms backwards}

#view[data-fx~="nav"] .path .node,#view[data-fx~="nav"] .path .unit-h{animation:nodeIn 440ms var(--ease-out) backwards;animation-delay:calc(var(--n,0) * 50ms)}
#view[data-fx~="nav"] .tab.on svg{animation:popBig 360ms var(--ease-out)}
#view[data-fx~="nav"] .meter i{animation:grow 700ms var(--ease-out) 200ms backwards}
#view[data-fx~="nav"] .items .item{animation:rise 320ms var(--ease-out) backwards}
#view[data-fx~="nav"] .lg-hero .mascot{animation:popBig 520ms var(--ease-out) 200ms backwards,bobA 2.4s linear 720ms infinite}
/* la respuesta de la IA, la pista y la elección entran animadas; el resto no se mueve */
#view[data-fx~="ai"] .ai{animation:pop 260ms var(--ease-out)}
#view[data-fx~="hint"] .hintcard{animation:rise 300ms var(--ease-out)}
#view[data-fx~="sel"] .opt.sel,#view[data-fx~="sel"] .pickcard.sel{animation:selPop 240ms var(--ease-out)}
#view[data-fx~="sel"] .pb-res{animation:rise 260ms var(--ease-out)}
#view[data-fx~="buy"] .avatar{animation:popBig 420ms var(--ease-out)}
/* resultado correcto: el único lugar con festejo */
#view[data-fx~="nav"] .verdict.good{animation:pop 300ms var(--ease-out) backwards}
#view[data-fx~="nav"] .verdict.good .pts{animation:popBig 420ms var(--ease-out) 120ms backwards}
#view[data-fx~="nav"] .verdict.good .mascot{animation:hop 640ms var(--ease-out) 200ms}
#view[data-fx~="nav"] .burst svg{animation:fly 760ms var(--ease-out) 160ms backwards}
#view[data-fx~="nav"] .rew{animation:rise 380ms var(--ease-out) 220ms backwards}
#view[data-fx~="nav"] .rew ul.bd li{animation:rise 300ms var(--ease-out) backwards;animation-delay:calc(320ms + var(--n,0) * 60ms)}
#view[data-fx~="nav"] .tokwin .ficha{animation:popBig 460ms var(--ease-out) 520ms backwards}
#view[data-fx~="nav"] .jugbox{animation:rise 340ms var(--ease-out) 480ms backwards}
/* error: la mascota se sacude una vez */
#view[data-fx~="nav"] .failbox{animation:wiggle 460ms var(--ease-out) 120ms}
/* hojas y diálogos */
#overlay[data-fx="open"] .overlay{animation:fade 220ms ease-out}
#overlay[data-fx="open"] .overlay:not(.mid) .sheet{animation:sheetUp 380ms var(--ease-drawer)}
#overlay[data-fx="open"] .overlay.mid .sheet{animation:pop 240ms var(--ease-out)}

/* sin movimiento: ajuste del sistema o botón "Quitar animaciones" */
@media (prefers-reduced-motion:reduce){
  :root:not([data-motion="on"]) *,:root:not([data-motion="on"]) *::before,:root:not([data-motion="on"]) *::after{animation:none!important;transition:none!important}
  :root:not([data-motion="on"]) .burst{display:none}
}
:root[data-motion="off"] *,:root[data-motion="off"] *::before,:root[data-motion="off"] *::after{animation:none!important;transition:none!important}
:root[data-motion="off"] .burst{display:none}
.verdict.good .mascot .m-b{fill:#fff}

.coinnote.luck{background:var(--lima);border-color:var(--lima-d);color:var(--azul)}.coinnote.luck p,.coinnote.luck b{color:var(--azul)}
@keyframes jugIn{0%{opacity:0;transform:translateY(300px) rotateX(70deg) scale(.7)}18%{opacity:1}70%{transform:translateY(-14px) rotateX(-8deg) scale(1.05)}100%{opacity:1;transform:translateY(0) rotateX(0) scale(1)}}
#view[data-fx~="nav"] .jug3{animation:jugIn 1000ms var(--ease-out) backwards}
#view[data-fx~="nav"] .tokwin .ficha{animation:popBig 460ms var(--ease-out) 1000ms backwards}
/* clase en vivo */
.livebox{display:flex;align-items:center;gap:12px;color:#000}
.livebox b{display:block;color:#000;font-size:1rem}.livebox small{display:block;color:#000;font-size:.8125rem;line-height:1.3}
.livebox.on{background:var(--lima);color:var(--azul);border-radius:16px;padding:10px 12px}
.livebox.on b,.livebox.on small,.livebox.on .lv-t{color:var(--azul)}
.lv-t{margin-left:auto;font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.lv-dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--azul);animation:lvPulse 1.4s ease-in-out infinite}
@keyframes lvPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
:root[data-motion="off"] .lv-dot{animation:none}
/* logotipo (tiene trazo blanco: siempre sobre morado) */
.logo{display:block;height:30px;width:auto}
.logo-xl{height:auto;width:min(100%,300px)}
.brandbar{background:var(--violeta);padding:12px 18px}
.brandbar .stat{background:var(--lima);color:var(--azul);border-color:var(--lima-d)}
.livechip{display:inline-flex;align-items:center;gap:6px;margin-top:6px;background:var(--lima);color:var(--azul);border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:800}
.livechip .lv-dot{width:8px;height:8px}.livechip .mono{font-variant-numeric:tabular-nums;color:var(--azul)}
/* pantalla de jugada: contenido centrado y botón abajo */
.jugscr{display:flex;flex-direction:column;align-items:stretch;text-align:center}
.jug-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:2px}
.jug-btn{flex:none;margin-top:16px}
.jugscr .coinnote{margin-top:14px;text-align:center}
.brandbar .stat.nm{max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* personaje definitivo: parpadeo y micromovimientos suaves */
.mascot,.avatar{display:block;overflow:visible}
.mi{transform-box:fill-box;transform-origin:50% 100%;animation:mIdle 3.8s ease-in-out infinite;animation-delay:var(--bd,0s)}
@keyframes mIdle{0%,100%{transform:translateY(0) scale(1,1) rotate(0)}50%{transform:translateY(-.8%) scale(1.004,1.012) rotate(.45deg)}}
.cb .eye{transform-box:fill-box;transform-origin:50% 50%;animation:mBlink 5.4s infinite;animation-delay:var(--bd,0s)}
@keyframes mBlink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.07)}96%{transform:scaleY(1)}}
.lg-hero .mascot{width:112px;right:14px;animation:none}
#view[data-fx~="nav"] .lg-hero .mascot{animation:popBig 520ms var(--ease-out) 200ms backwards}
.tut-m .mascot{animation:none}
.tut-m{width:150px}.tut-m.sm{width:96px}
.res-m{width:130px}
.verdict .mascot{width:62px}
.failbox .mascot{width:100%}
/* tienda: personaje a la vista y accesorios */
.shopav{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:14px;padding:10px 14px;margin-top:12px}
.sa-fig{flex:none}
.sa-t{display:flex;flex-direction:column;gap:6px;align-items:flex-start;color:#000}.sa-t b{color:#000;font-size:1.0625rem}.sa-t .small{color:#000}
.item .art{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1/1;border:2px solid var(--hair);border-radius:16px;background:#fff;padding:6px;margin-bottom:6px;transition:transform 120ms var(--ease-out),border-color 160ms ease}
.item .art svg{width:100%;height:100%}
.item .art:active{transform:scale(.96)}
.item.tried .art{border-color:var(--violeta);box-shadow:0 0 0 3px var(--accent-soft)}
:root[data-motion="off"] .mi,:root[data-motion="off"] .eye{animation:none!important}
/* el personaje es morado: sobre fondos morados va sobre un círculo lima */
.lg-hero .mascot,.tut-m .mascot{background:var(--lima);border-radius:46% 46% 40% 40%/38% 38% 30% 30%;padding:6px 8px;box-sizing:content-box}
/* ingreso: ilustración arriba, formulario abajo y "Entrar" fijo al pie */
.loginscr{display:flex;flex-direction:column;min-height:100%}
.lg-hero{background:var(--azul);margin:-18px -18px 6px;padding:26px 18px 22px;border-radius:0 0 36px 36px;display:flex;flex-direction:column;align-items:center;min-height:300px;overflow:hidden}
.lg-hero .mascot,.lg-hero .mascot:not(#x){position:relative;right:auto;bottom:auto;width:176px;padding:0;background:none;border-radius:0;z-index:1}
.lg-hero h1{position:relative;z-index:2;margin-top:-38px!important;width:100%;display:flex;justify-content:center}
.lg-hero .logo-xl{width:min(84%,270px)}
.lg-hero .st{position:absolute;pointer-events:none}
.lg-hero .st1{left:7%;top:12%;width:15%;fill:var(--lima);animation:bobB 1.8s linear infinite}
.lg-hero .st2{right:6%;top:8%;width:24%;fill:var(--lapacho);animation:bobA 2.6s linear infinite}
.lg-hero .st3{left:9%;top:52%;width:10%;fill:var(--lapacho);animation:bobA 2.2s linear -.7s infinite}
.lg-hero .st4{right:10%;top:50%;width:13%;fill:var(--lima);animation:bobB 2s linear -.4s infinite}
.lg-hero .st5{left:44%;top:3%;width:7%;fill:#fff;opacity:.9;animation:bobB 1.5s linear -1s infinite}
.lg-tag{font-size:1.125rem;line-height:1.35;text-align:center;font-weight:700;color:#000;margin-top:8px}
.login-cta{position:sticky;bottom:-30px;margin:auto -18px -30px;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 28%)}
:root[data-motion="off"] .lg-hero .st{animation:none}
.loginscr>*{flex-shrink:0}

/* ingreso: una sola estrella grande rosada que gira */
.lg-hero .st1{left:auto;right:-26%;top:-16%;width:86%;fill:var(--lapacho);opacity:.95;animation:starSpin 22s linear infinite;transform-origin:50% 50%}
@keyframes starSpin{to{transform:rotate(360deg)}}
.fig{margin:0 auto 6px}.fig .mascot{width:100%}
.card.center .fig{margin-bottom:4px}
/* ingreso: composición centrada (personaje + logo como un solo bloque, con aire parejo arriba y abajo) */
.lg-hero{justify-content:center;min-height:340px;padding:32px 18px 32px}
.lg-hero .mascot,.lg-hero .mascot:not(#x){width:min(62%,230px)}
.lg-hero h1{margin-top:-44px!important}
.lg-hero .logo-xl{width:min(82%,290px)}
.lg-tag{margin-top:16px}
.redeem .row{gap:8px}.redeem input{flex:1;min-width:0}
.redeem-ok{background:var(--lima);color:var(--azul);border:2px solid var(--lima-d);border-radius:16px;padding:10px 14px}.redeem-ok b,.redeem-ok p{color:var(--azul)}.redeem-ok p{margin-top:2px;font-weight:700}

function sumSt(st){var T={a:0,c:0,m:0,ej:0,ex:0,d:0,b:0,k:0};(st||[]).forEach(function(t){for(var k in T)T[k]+=t[k]||0;});return T;}
function simStats(code,i){var c=DB.courses[code];var h=0;for(var q=0;q<code.length;q++)h=(h*31+code.charCodeAt(q))%997;
 return (c?c.units:[]).map(function(u){return {t:u.title,a:12+((h+i)%7),c:9+((h+i)%5),m:(h*3+i)%5,ej:(h+i*2)%4,ex:(h+i*3)%3,d:((h+i)%5===0)?3:(((h+i)%3===0)?1:0),b:(h*(i+2))%4,k:(h+i)%3};});}
function sims(code){var h=0;for(var i=0;i<code.length;i++)h=(h*31+code.charCodeAt(i))%997;
 return SIM_NAMES.map(function(n,i){var st=simStats(code,i);var T=sumSt(st);return {nick:n,full:n,points:20+((h*(i+3)*7)%140),blind:T.b,caught:T.k,st:st,sim:true};});}

/* ---------- render ---------- */
function captureKeep(){var els=document.querySelectorAll('[data-keep]');for(var i=0;i<els.length;i++){UI.keep[els[i].id]=els[i].value;}}
function restoreKeep(){var els=document.querySelectorAll('[data-keep]');for(var i=0;i<els.length;i++){var v=UI.keep[els[i].id];if(v!==undefined)els[i].value=v;}}
/* camino lima: una curva suave que pasa por el centro exacto de cada nodo (los nodos están fijos sobre la curva).
   Lo ya recorrido va pleno; lo que falta, más suave. */
function curvePath(pts){
 var d='M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);
 for(var i=0;i<pts.length-1;i++){var p0=pts[i],p1=pts[i+1],dy=(p1[1]-p0[1])*.5;
  d+=' C'+p0[0].toFixed(1)+','+(p0[1]+dy).toFixed(1)+' '+p1[0].toFixed(1)+','+(p1[1]-dy).toFixed(1)+' '+p1[0].toFixed(1)+','+p1[1].toFixed(1);}
 return d;}
/* spline Catmull-Rom: pasa por los centros sin frenar en cada punto */
function splinePath(P){var d='M'+P[0][0].toFixed(1)+','+P[0][1].toFixed(1);
 for(var i=0;i<P.length-1;i++){var a=P[i-1]||P[i],b=P[i],c=P[i+1],e=P[i+2]||P[i+1];
  d+=' C'+(b[0]+(c[0]-a[0])/6).toFixed(1)+','+(b[1]+(c[1]-a[1])/6).toFixed(1)+' '+(c[0]-(e[0]-b[0])/6).toFixed(1)+','+(c[1]-(e[1]-b[1])/6).toFixed(1)+' '+c[0].toFixed(1)+','+c[1].toFixed(1);}
 return d;}
function drawPaths(){
 var ps=document.querySelectorAll('#view .path');
 for(var x=0;x<ps.length;x++){var p=ps[x];
  var old=p.querySelector('.path-line');if(old)old.parentNode.removeChild(old);
  var nodes=[].slice.call(p.querySelectorAll('.node'));if(nodes.length<2)continue;
  var w=p.offsetWidth,h=p.scrollHeight;
  /* una sola curva de fondo por el centro de los nodos (posiciones originales); se prolonga más allá del primero y del último y se desvanece en los bordes, sin principio ni final visibles */
  var pts=nodes.map(function(n){var c=n.querySelector('.circ')||n;return [n.offsetLeft+c.offsetLeft+c.offsetWidth/2,n.offsetTop+c.offsetTop+c.offsetHeight/2];});
  var f0=pts[0],f1=pts[1],l0=pts[pts.length-1],l1=pts[pts.length-2];
  pts.unshift([2*f0[0]-f1[0],f0[1]-Math.max(140,f1[1]-f0[1])]);
  pts.push([2*l0[0]-l1[0],l0[1]+Math.max(140,l0[1]-l1[1])]);
  p.insertAdjacentHTML('afterbegin','<svg class="path-line" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true" focusable="false"><path class="pl-all" pathLength="1" d="'+splinePath(pts)+'"/></svg>');}}window.addEventListener('resize',drawPaths);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawPaths);

function maybePrompt(){var s=cur();if(!s||UI.tab!=='home'||UI.screen!=='main')return;
 if(!(s.units[UI.subject]||[]).length&&!UI.prompted[UI.subject]){UI.prompted[UI.subject]=true;UI.ov={type:'load'};}}
function readForm(a,b){var t=($(a)||{}).value||'';var x=($(b)||{}).value||'';return {title:t.trim().slice(0,40),text:x.trim()};}

/* ---------- acciones ---------- */
function tutFinish(){var role=UI.ov&&UI.ov.role;
 if(role==='alumno'&&cur())cur().tut=true;if(role==='profesor'&&curT())curT().tut=true;
 saveDB();UI.ov=null;if(role==='alumno')maybePrompt();render();}
var ACT={
 motionTg:function(){MOTION=motionOff()?'on':'off';try{localStorage.setItem('desafia_motion',MOTION);}catch(e){}applyMotion();render();},
 soundTg:function(){SND.on=!SND.on;try{localStorage.setItem('desafia_sound',SND.on?'on':'off');}catch(e){}render();if(SND.on)sfx('ok');},
 tutorial:function(){UI.ov={type:'tut',role:DB.session.role,step:0};render();},
 tutNext:function(){var o=UI.ov;if(o.step>=TUT[o.role].length-1){sfx('done');tutFinish();return;}o.step++;o.ds={};UI.fx='sel';render();},
 tutSkip:function(){tutFinish();},
 tutPick:function(i,b){var o=UI.ov,ds=o.ds;ds.m=+b.dataset.i;if(needsDecision(DEMO_TP,ds.m)){ds.phase='compare';}else{ds.out=tpOut(DEMO_TP,ds.m,'none');ds.phase='res';sfx(ds.out.correct?'ok':'bad');}render();},
 tutDec:function(i,b){var ds=UI.ov.ds;ds.out=tpOut(DEMO_TP,ds.m,b.dataset.v);ds.phase='res';sfx(ds.out.correct?'ok':'bad');render();},
 tutCe:function(i,b){var ds=UI.ov.ds;ds.sels=ds.sels||[];var k=+b.dataset.i;var p=ds.sels.indexOf(k);if(p>-1)ds.sels.splice(p,1);else ds.sels.push(k);render();},
 tutCeSubmit:function(){var ds=UI.ov.ds;ds.out=ceOut(DEMO_CE,ds.sels);sfx(ds.out.correct?'ok':'bad');render();},
 tutRetry:function(){UI.ov.ds={};render();},
 tutHelp:function(i,b){var ds=UI.ov.ds;ds.h=ds.h||{};ds.h[b.dataset.v]=true;render();},
 tutT:function(i,b){var ds=UI.ov.ds,v=b.dataset.v;ds[v]=true;if(v==='live'){ds.end=Date.now()+LIVE_MS;sfx('enter');}else sfx('select');render();},
 tutStu:function(){UI.ov.ds.open=true;render();},
 reset:function(){UI.ov={type:'confirm',title:'¿Reiniciar la demo?',msg:'Se borran los alumnos, profesores, clases y contenidos creados en este navegador.',yes:'resetYes',yesLabel:'Reiniciar'};render();},
 resetYes:function(){DB=freshDB();saveDB();G=null;UI.ov=null;UI.screen='main';UI.tab='home';UI.tcourse=null;UI.newCourse=false;UI.prompted={};UI.classSel=null;renderClean();toast('Demo reiniciada');},
 closeOv:function(){UI.ov=null;render();},
 overlayBg:function(i,b,e){if(e.target===b&&UI.ov&&UI.ov.type!=='busy'&&UI.ov.type!=='tut'){UI.ov=null;render();}},
 setRole:function(i,b){UI.role=b.dataset.v;render();},
 login:function(){
  var full=(($('#fFull')||{}).value||'').trim().slice(0,40);
  if(UI.role==='alumno'){
   var f={full:full,school:(($('#fSchool')||{}).value||'').trim().slice(0,50),year:(($('#fYear')||{}).value||''),section:(($('#fSect')||{}).value||'').trim().slice(0,20)};
   if(!f.full||!f.school||!f.year||!f.section){toast('Completá nombre completo, colegio, año y curso');return;}
   var k=stuKey(f);if(!DB.students[k])DB.students[k]=newStudent(f);
   DB.session={role:'alumno',key:k};UI.tab='home';UI.screen='main';UI.subjOpen=false;UI.keep={};
   if(!DB.students[k].tut)UI.ov={type:'tut',role:'alumno',step:0};else maybePrompt();
  }else{
   if(!full){toast('Escribí tu nombre para entrar');return;}
   var cd=((($('#fCode')||{}).value)||'').trim().toUpperCase();
   if(!cd){toast('Ingresá el código de tu colegio');return;}
   if(!SCHOOL_CODES[cd]){toast('Ese código de colegio no es válido');return;}
   var kt=full.toLowerCase();if(!DB.teachers[kt])DB.teachers[kt]={name:full,courses:[],tut:false};DB.teachers[kt].school=SCHOOL_CODES[cd];
   DB.session={role:'profesor',key:kt};UI.tcourse=null;UI.newCourse=false;UI.keep={};
   if(!DB.teachers[kt].tut)UI.ov={type:'tut',role:'profesor',step:0};}
  saveDB();UI.fx='nav';renderClean();},
 logout:function(){DB.session=null;G=null;UI.screen='main';UI.ov=null;UI.keep={};UI.prompted={};UI.classSel=null;saveDB();renderClean();},
 tab:function(i,b){UI.tab=b.dataset.v;UI.classErr='';UI.subjOpen=false;maybePrompt();render();},
 toggleSubj:function(){UI.subjOpen=!UI.subjOpen;rerender();},
 pickSubject:function(i,b){UI.subject=b.dataset.v;UI.subjOpen=false;maybePrompt();render();},
 openLoad:function(){UI.ov={type:'load'};render();},
 genUnit:function(i,b){if(UI.ov&&UI.ov.type==='busy')return;var where=b.dataset.v;var f=readForm('#fTitle','#fText');
  if(!f.title){toast('Ponele un nombre al contenido');return;}
  if(f.text.length<60){toast('Pegá un texto un poco más largo (unas cuantas oraciones)');return;}
  if(where==='load'){var s=cur();var subj=UI.subject;runGen({title:f.title,text:f.text,subject:subj},function(u){(s.units[subj]=s.units[subj]||[]).push(u);});}
  else{var code=UI.ov.code;var c=DB.courses[code];runGen({title:f.title,text:f.text,subject:c.subject},function(u){c.units.push(u);});}},
 useExample:function(i,b){var where=b.dataset.v;
  if(where==='load'){var s=cur();var subj=UI.subject;(s.units[subj]=s.units[subj]||[]).push(makeUnit(EX[subj],subj));}
  else{var c=DB.courses[UI.ov.code];c.units.push(makeUnit(EX[c.subject],c.subject));}
  saveDB();UI.ov=null;UI.fx='nav';renderClean();toast('Ejemplo cargado: rondas listas');},
 cancelGen:function(){if(CTL)CTL.abort();},
 delUnit:function(i,b){UI.ov={type:'confirm',title:'¿Eliminar este tema?',msg:'Se borra el tema y tu progreso en sus puntos. Los puntos que ya ganaste se conservan.',yes:'delUnitYes',yesLabel:'Eliminar',uid:b.dataset.v};render();},
 delUnitYes:function(){var s=cur();var id=UI.ov.uid;var arr=s.units[UI.subject]||[];s.units[UI.subject]=arr.filter(function(u){return u.id!==id;});
  for(var k=0;k<6;k++)delete s.progress[id+':'+k];saveDB();UI.ov=null;render();toast('Tema eliminado');},
 node:function(i,b){if(b.dataset.lock){toast('Completá el paso anterior para desbloquear este');return;}
  var p=b.dataset.v.split('|');UI.ov={type:'round',uid:p[0],idx:+p[1],src:b.dataset.s,code:b.dataset.c};render();},
 startRound:function(){var o=UI.ov;var u=findUnit(o.src,o.code,o.uid);if(!u){UI.ov=null;render();return;}sfx('enter');startRound(u,o.idx,o.src,o.code);},
 again:function(){if(G.queue.length>1)G.queue.push(G.queue.shift());setQ(G.queue[0]);UI.fx='q';render();},
 next:function(){G.done++;G.queue.shift();if(G.done>=G.n){completePoint();UI.fx='nav';render();}else{setQ(G.queue[0]);UI.fx='q';render();}},
 exit:function(){if(G.phase==='play'||G.phase==='answer'||G.phase==='compare'||G.phase==='ok'||G.phase==='fail'){UI.ov={type:'confirm',pose:'alto',title:'¿Salir del punto?',msg:'Si salís ahora perdés el avance de este punto. Si ya pediste la respuesta directa, no se devuelve la IA Coin.',yes:'exitYes',yesLabel:'Salir'};render();}else{ACT.exitYes();}},
 exitYes:function(){G=null;UI.screen='main';UI.ov=null;render();},
 coinNext:function(){var nj=G.rew.jugNew;G.phase=nj?'jug':'result';if(nj){sfx('enter');setTimeout(function(){sfx(G.rew&&G.rew.jugCoin?'coin':'ok');},760);}else sfx('done');UI.fx='nav';render();},
 jugNext:function(){G.phase='result';sfx('done');UI.fx='nav';render();},
 startLive:function(i,b){var c=DB.courses[b.dataset.v];if(!c)return;c.live={end:Date.now()+LIVE_MS};saveDB();sfx('enter');rerender();},
 endLive:function(i,b){var c=DB.courses[b.dataset.v];if(!c)return;c.live=null;saveDB();rerender();},
 redeem:function(){var el=$('#redeemIn');var v=((el&&el.value)||'').trim().toUpperCase();
  if(!v){UI.redeem={ok:false,msg:'Escribí tu código.'};}
  else if(!/^DSF-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(v)){UI.redeem={ok:false,msg:'Ese código no tiene el formato correcto. Se ve así: DSF-XXXX-XXXX.'};}
  else{UI.redeem={ok:true,code:v,prize:'+60 puntos y un accesorio sorpresa (premio de ejemplo)'};sfx('coin');}
  UI.keepScroll=true;render();},
 openJugs:function(){UI.ov={type:'jugs'};render();},
 skipQ:function(){G.h={};G.done++;G.queue.shift();if(G.done>=G.n){completePoint();UI.fx='nav';render();}else{setQ(G.queue[0]);UI.fx='q';render();}},
 back:function(){G=null;UI.screen='main';UI.fx='nav';render();},
 helpEj:function(){if(G.h.ej)return;G.h.ej=true;thOf(cur(),G.unit).ej++;saveDB();UI.fx='hint';rerender();},
 helpExp:function(){if(G.h.exp)return;G.h.exp=true;thOf(cur(),G.unit).ex++;saveDB();UI.fx='hint';rerender();},
 helpDir:function(){var s=cur();if(G.h.dir)return;
  if(!G.practice){if(s.coins<1){toast('Necesitás una IA Coin');return;}s.coins--;}
  G.h.dir=true;thOf(s,G.unit).d++;saveDB();UI.fx='hint';rerender();},
 tpPick:function(i,b){G.m=+b.dataset.i;G.phase='compare';UI.fx='ai';rerender();},
 tpDec:function(i,b){var dec=b.dataset.v;G.dec=dec;qResult(tpOut(G.t,G.m,dec));UI.fx='nav';render();},
 ceTog:function(i,b){var k=+b.dataset.i;var p=G.sels.indexOf(k);if(p>-1)G.sels.splice(p,1);else G.sels.push(k);UI.fx='sel';rerender();},
 ceSubmit:function(){qResult(ceOut(G.d,G.sels));UI.fx='nav';render();},
 rbPick:function(i,b){G.sel=+b.dataset.i;UI.fx='sel';rerender();},
 rbSubmit:function(){var o=G.opts[G.sel];qResult(o.g?{correct:true,meter:'criterio',blind:0,caught:0}:{correct:false,meter:'criterio',blind:0,caught:0,reason:'Esa respuesta no alcanza para rebatir a la IA. '+o.why});UI.fx='nav';render();},
 bnPick:function(i,b){G.sel=+b.dataset.i;UI.fx='sel';rerender();},
 bnSubmit:function(){var it=G.items[G.sel];var real=G.kind==='real';var ok=real?!!it.d.real:!!it.best;
  qResult(ok?{correct:true,meter:'ojo',blind:0,caught:0}:{correct:false,meter:'ojo',blind:0,caught:0,reason:real?'Esa no era la imagen auténtica. '+G.d.clues.map(function(c){return c[0]+': '+c[1];}).join(' '):'Esa no es la fuente más confiable. '+it.why});UI.fx='nav';render();},
 pbPick:function(i,b){G.sel=+b.dataset.i;if(G.seen.indexOf(G.sel)<0)G.seen.push(G.sel);UI.fx='sel';rerender();},
 pbSubmit:function(){var it=G.items[G.sel];qResult(it.best?{correct:true,meter:'cabeza',blind:0,caught:0}:{correct:false,meter:'cabeza',blind:0,caught:0,reason:'Ese pedido no te ayuda a aprender. '+it.why});UI.fx='nav';render();},
 joinCourse:function(){var s=cur();var inp=$('#codeIn');var code=((inp&&inp.value)||'').trim().toUpperCase();var c=DB.courses[code];
  if(!c){UI.classErr='No encontramos ese código. Revisalo con tu profesor.';render();return;}
  if(s.courses.indexOf(code)>-1){UI.classErr='Ya estás en esa clase.';render();return;}
  UI.classErr='';s.courses.push(code);UI.classSel=code;if(c.members.indexOf(DB.session.key)<0)c.members.push(DB.session.key);saveDB();UI.ov=null;render();toast('Entraste a '+c.name);sfx('ok');},
 openJoin:function(){UI.classErr='';UI.ov={type:'join'};render();},
 pickClass:function(i,b){UI.classSel=b.dataset.v;render();},
 openBoard:function(){UI.ov={type:'board',code:UI.classSel};render();},
 leaveCourse:function(){var s=cur();var code=UI.classSel;var c=DB.courses[code];if(c)c.members=c.members.filter(function(k){return k!==DB.session.key;});
  s.courses=s.courses.filter(function(k){return k!==code;});UI.classSel=null;saveDB();render();},
 buy:function(i,b){var s=cur();var it=null;ITEMS.forEach(function(x){if(x.id===b.dataset.v)it=x;});if(!it||s.owned.indexOf(it.id)>-1)return;
  if(wallet(s)<it.price){toast('No te alcanzan los puntos');return;}
  s.spent+=it.price;s.owned.push(it.id);s.equipped[it.cat]=it.id;UI.prev={};saveDB();UI.fx='buy';render();toast(it.name+' comprado y equipado');sfx('coin');},
 tryOn:function(i,b){var it=null;ITEMS.forEach(function(x){if(x.id===b.dataset.v)it=x;});if(!it)return;UI.prev=UI.prev||{};if(UI.prev[it.cat]===it.id)delete UI.prev[it.cat];else UI.prev[it.cat]=it.id;sfx('select');UI.fx='sel';rerender();},
 tryOff:function(){UI.prev={};rerender();},
 equip:function(i,b){var s=cur();var c=b.dataset.c;var v=b.dataset.v;if(v)s.equipped[c]=v;else delete s.equipped[c];saveDB();render();},
 cheat:function(){var s=cur();s.points+=100;saveDB();render();toast('+100 puntos de prueba');},
 newCourse:function(){UI.newCourse=!UI.newCourse;render();},
 createCourse:function(){var t=curT();var nm=(($('#cName')||{}).value||'').trim().slice(0,30);var sj=($('#cSubj')||{}).value||'hist';
  var f=readForm('#cTitle','#cText');
  if(!nm){toast('Poné un nombre a la clase');return;}
  var wantsGen=!!(f.title||f.text);
  if(wantsGen&&(!f.title||f.text.length<60)){toast('Para generar rondas poné un nombre y un texto más largo, o dejá el contenido vacío');return;}
  var code=genCode();DB.courses[code]={code:code,name:nm,subject:sj,teacher:t.name,members:[],units:[]};t.courses.push(code);UI.newCourse=false;UI.tcourse=code;saveDB();
  if(wantsGen){renderClean();runGen({title:f.title,text:f.text,subject:sj},function(u){DB.courses[code].units.push(u);});}
  else{renderClean();toast('Clase creada · código '+code);}},
 createCourseEx:function(){var t=curT();var nm=(($('#cName')||{}).value||'').trim().slice(0,30);var sj=($('#cSubj')||{}).value||'hist';
  if(!nm){toast('Poné un nombre a la clase');return;}
  if(!EX[sj]){toast('Por ahora el ejemplo es solo de Historia: elegí Historia o subí tu contenido');return;}
  var code=genCode();DB.courses[code]={code:code,name:nm,subject:sj,teacher:t.name,members:[],units:[makeUnit(EX[sj],sj)]};t.courses.push(code);UI.newCourse=false;UI.tcourse=code;saveDB();renderClean();toast('Clase creada con el ejemplo · código '+code);sfx('ok');},
 openCourse:function(i,b){UI.tcourse=b.dataset.v;render();},
 closeCourse:function(){UI.tcourse=null;render();},
 openTAdd:function(){UI.ov={type:'tadd',code:UI.tcourse};render();},
 tdelUnit:function(i,b){UI.ov={type:'confirm',title:'¿Quitar este contenido?',msg:'Los alumnos dejan de ver este tema en el camino de la clase.',yes:'tdelUnitYes',yesLabel:'Quitar',uid:b.dataset.v};render();},
 tdelUnitYes:function(){var c=DB.courses[UI.tcourse];var id=UI.ov.uid;c.units=c.units.filter(function(u){return u.id!==id;});saveDB();UI.ov=null;render();},
 sort:function(i,b){UI.sort=b.dataset.v;render();},
 openStu:function(i,b){UI.ov={type:'stu',i:+b.dataset.v};render();},
 copy:function(i,b){var v=b.dataset.v;var done=function(){toast('Código copiado');};
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).then(done,function(){toast('Copialo a mano: '+v);});}else{toast('Copialo a mano: '+v);}}catch(e){toast('Copialo a mano: '+v);}}
};

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b)return;
 var act=b.dataset.act;var i=b.dataset.i!==undefined?+b.dataset.i:null;
 if(act==='overlayBg'&&e.target!==b)return;
 if(ACT[act])ACT[act](i,b,e);
});
document.addEventListener('keydown',function(e){
 if(e.key==='Enter'&&e.target&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();var a=e.target.dataset.enter;if(ACT[a])ACT[a]();}
});
document.addEventListener('change',function(e){
 var t=e.target;if(!t||t.id!=='fileIn'||!t.files||!t.files[0])return;
 var f=t.files[0];if(f.size>400000){toast('El archivo es muy grande para el prototipo');return;}
 var r=new FileReader();r.onload=function(){var ta=$('#fText');var ti=$('#fTitle');if(ta)ta.value=String(r.result||'');UI.keep.fText=ta?ta.value:'';if(ti&&!ti.value){ti.value=f.name.replace(/\.[^.]+$/,'').slice(0,40);UI.keep.fTitle=ti.value;}toast('Archivo cargado');};
 r.onerror=function(){toast('No se pudo leer el archivo');};r.readAsText(f);
});

render();
getSample().then(function(){render();});
})();

</script>
